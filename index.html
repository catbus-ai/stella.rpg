<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stella</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        height: 100%;
      }
      body {
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100dvh;          /* dynamic viewport — shrinks with mobile browser chrome */
        min-height: -webkit-fill-available;  /* Safari fallback */
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        touch-action: none;
      }

      /* ── Crisp pixel font rendering — disable browser antialiasing ── */
      * {
        -webkit-font-smoothing: none;
        -moz-osx-font-smoothing: unset;
        font-smooth: never;
      }

      /* ── Rotate notice — portrait mode on mobile/tablet only ── */
      #rotate-notice {
        display: none;
      }
      @media (orientation: portrait) and (max-width: 1024px) {
        #rotate-notice {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: #000;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 24px;
          font-family: "Press Start 2P", monospace;
          text-align: center;
          padding: 32px;
        }
        /* Pause the game canvas behind the overlay */
        canvas { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="rotate-notice">
      <div style="font-size: 64px; animation: spin 2s ease-in-out infinite;">⟳</div>
      <p style="font-size: 11px; color: #ffff00; line-height: 2.2;">ROTATE YOUR DEVICE</p>
      <p style="font-size: 7px; color: #888888; line-height: 2.4;">Stella works best<br>in landscape mode</p>
    </div>
    <style>
      @keyframes spin {
        0%   { transform: rotate(0deg);   }
        40%  { transform: rotate(90deg);  }
        60%  { transform: rotate(90deg);  }
        100% { transform: rotate(90deg);  }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
